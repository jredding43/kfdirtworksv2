<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Admin</title>
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: system-ui, Arial, sans-serif; padding: 2rem; }
      .wrap { max-width: 560px; margin: 0 auto; }
      .hidden { display: none; }
      button {
        border: 0; padding: .75rem 1rem; border-radius: .5rem;
        font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>CMS Login</h1>
      <p id="status">Loading Identity…</p>
      <button id="loginBtn" class="hidden">Log in with Netlify Identity</button>
      <button id="logoutBtn" class="hidden">Log out</button>
    </div>

    <!-- Decap CMS app -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <!-- Netlify Identity widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <script>
      (function () {
        const statusEl = document.getElementById('status');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        function setStatus(msg) {
          if (statusEl) statusEl.textContent = msg;
        }

        function handleInviteIfAny() {
          if (location.hash && location.hash.includes('invite_token=')) {
            setStatus('Accepting invite…');
            return window.netlifyIdentity.acceptInvite(true) // open password UI
              .then(() => window.location.replace('/admin/'))
              .catch(e => {
                console.error('Invite accept failed:', e);
                setStatus('Invite accept failed — check console.');
              });
          }
          return Promise.resolve();
        }

        function onReady() {
          const ni = window.netlifyIdentity;
          if (!ni) {
            setStatus('Identity widget failed to load. Check ad/script blockers.');
            loginBtn.classList.remove('hidden'); // still show manual button
            return;
          }

          // Wire buttons
          loginBtn.onclick = () => ni.open('login');
          logoutBtn.onclick = () => ni.logout();

          ni.on('init', user => {
            handleInviteIfAny().then(() => {
              if (user) {
                setStatus(`Logged in as ${user.email}`);
                logoutBtn.classList.remove('hidden');
                // Redirect into CMS app proper
                if (!/\/admin\/?$/i.test(location.pathname)) {
                  window.location.href = '/admin/';
                }
              } else {
                setStatus('Not logged in');
                loginBtn.classList.remove('hidden');
                // Auto-open login once on first load
                ni.open('login');
              }
            });
          });

          ni.on('login', user => {
            setStatus(`Logged in as ${user.email}`);
            loginBtn.classList.add('hidden');
            logoutBtn.classList.remove('hidden');
            // Ensure we land on the CMS UI
            window.location.href = '/admin/';
          });

          ni.on('logout', () => {
            setStatus('Logged out');
            logoutBtn.classList.add('hidden');
            loginBtn.classList.remove('hidden');
          });

          ni.on('error', err => {
            console.error('Identity error:', err);
            setStatus('Identity error — check console.');
            loginBtn.classList.remove('hidden');
          });

          ni.init();
        }

        // Wait for both scripts to exist
        const readyInterval = setInterval(() => {
          if (window.netlifyIdentity && window.CMS) {
            clearInterval(readyInterval);
            onReady();
          }
        }, 50);
        setTimeout(() => clearInterval(readyInterval), 8000); // stop trying after 8s
      })();
    </script>
  </body>
</html>
