<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Admin</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>

    <!-- Netlify Identity widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <script>
      function handleInvite() {
        if (location.hash && location.hash.includes('invite_token=')) {
          return netlifyIdentity.acceptInvite(true) // true => open password set UI
            .then(() => window.location.replace('/admin/'))
            .catch(e => console.error('Invite accept failed:', e));
        }
        return Promise.resolve();
      }

      netlifyIdentity.on('init', (user) => {
        handleInvite().then(() => {
          if (!user) netlifyIdentity.open('login');
        });
      });

      netlifyIdentity.init();
    </script>
  </body>
</html>
