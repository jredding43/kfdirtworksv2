backend:
  name: git-gateway
  branch: main

site_url: https://kfdirtworks.netlify.app
display_url: https://kfdirtworks.netlify.app

media_folder: "public/uploads"
public_folder: "/uploads"


collections:

# =========================
  # HOME PAGE (new)
  # Maps to your main page info block
  # =========================
  - label: "Home Page"
    name: "home_page"
    delete: false
    files:
      - label: "Home Page Content"
        name: "home"
        file: "src/content/home.json"
        fields:
          - label: "Location & Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Address (single line)", name: "address_line", widget: "string", default: "764 Hwy 395 N, Kettle Falls WA 99141" }
              - { label: "Phone", name: "phone", widget: "string", default: "(509) 738-2010" }
              - { label: "Hours (display)", name: "hours_display", widget: "string", default: "Fri-Sat · 9AM-5PM" }
              - { label: "Google Maps URL (optional)", name: "maps_url", widget: "string", required: false }

          

          # Your orange sections as editable, time-bound banners
          - label: "Announcement Banners"
            name: "banners"
            widget: "list"
            summary: "{{fields.title}} — active: {{fields.active}} (priority {{fields.priority}})"
            fields:
              - { label: "Title (internal)", name: "title", widget: "string" }
              - { label: "Message (plain text or brief Markdown)", name: "message", widget: "text" }
              - { label: "Active", name: "active", widget: "boolean", default: true }
              - { label: "Start Date (optional)", name: "start", widget: "datetime", required: false }
              - { label: "End Date (optional)", name: "end", widget: "datetime", required: false }
              - { label: "Priority (lower shows first)", name: "priority", widget: "number", default: 100 }
              - { label: "Background Class", name: "bg_class", widget: "string", default: "bg-orange-200", hint: "Tailwind class for background (e.g., bg-orange-200)" }
              - { label: "Text Class", name: "text_class", widget: "string", default: "text-gray-700", hint: "Tailwind class for text (e.g., text-gray-700)" }

          - label: "Now Selling Strip"
            name: "promo_strip"
            widget: "object"
            fields:
              - { label: "Enabled", name: "enabled", widget: "boolean", default: true }
              - { label: "Message", name: "message", widget: "string", default: "Now Selling KANIKSU FEEDS" }
              - { label: "Background Class", name: "bg_class", widget: "string", default: "bg-orange-200" }
              - { label: "Text Class", name: "text_class", widget: "string", default: "text-gray-700" }

 
  # =========================
  # FEED PAGE (existing)
  # =========================
  - label: "Feed Page Settings"
    name: "feed_settings"
    delete: false
    files:
      - label: "Feed Settings"
        name: "settings"
        file: "src/content/feed.json"
        fields:
          - { label: "Title", name: "title", widget: "string", default: "KANIKSU FEEDS" }
          - label: "Pickup Hours"
            name: "hours"
            widget: "object"
            fields:
              - { label: "Thu/Fri", name: "thu_fri", widget: "string", default: "Thursday & Friday 1pm–5pm" }
              - { label: "Saturday", name: "sat", widget: "string", default: "Saturday 9am–1pm" }
          - label: "Footer Notes"
            name: "notes"
            widget: "object"
            fields:
              - { label: "Bulk Availability", name: "bulk", widget: "string", default: "One Ton and ½ Ton Bags Available Upon Request" }
              - { label: "Call To Action", name: "cta", widget: "string", default: "Please call for Ordering & Pricing Information" }
          - label: "Emojis"
            name: "emojis"
            widget: "list"
            default: ["🐔", "🐄", "🐐", "🐎", "🐖", "🐇"]
            field: { label: "Emoji", name: "emoji", widget: "string" }

  - label: "Feed Products"
    name: "feed_items"
    folder: "src/content/feed-items"
    create: true
    slug: "{{slug}}"
    format: "json"
    sortable_fields: ["title", "price", "category", "updated"]
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "e.g., Mega Layer Mash" }
      - label: "Category"
        name: "category"
        widget: "select"
        required: false
        options:
          - "Chicken"
          - "Beef"
          - "Swine"
          - "Equine"
          - "Goat/Sheep"
          - "Rabbit"
          - "Dog/Cat"
          - "Hay"
          - "Supplements"
          - "Other"
          - " "
        hint: "Optional — leave blank if not applicable"
      - { label: "Bag Size (label)", name: "bagLabel", widget: "string", required: false, hint: "e.g., 50 lb" }
      - { label: "Price (USD)", name: "price", widget: "number", value_type: "float", min: 0 }
      - { label: "On Sale?", name: "onSale", widget: "boolean", default: false, required: false }
      - { label: "Sale Price (USD)", name: "salePrice", widget: "number", value_type: "float", min: 0, required: false }
      - { label: "SKU (optional)", name: "sku", widget: "string", required: false }
      - { label: "Sort Order", name: "order", widget: "number", default: 100, hint: "Lower shows first" }
      - { label: "Active", name: "active", widget: "boolean", default: true }
      - { label: "Updated", name: "updated", widget: "datetime", default: "", required: false, hint: "Auto-set when you publish" }

  # =========================
  # MARQUEE (Scrolling Banner)
  # =========================
  - label: "Marquee Banner"
    name: "marquee"
    delete: false
    files:
      - label: "Scrolling Marquee Content"
        name: "marquee_items"
        file: "src/content/marquee.json"
        fields:
          - { label: "Enabled", name: "enabled", widget: "boolean", default: true }
          - { label: "Speed (ms per cycle)", name: "speed", widget: "number", default: 30000, hint: "Adjust animation speed (higher = slower)" }
          - label: "Messages"
            name: "messages"
            widget: "list"
            summary: "{{fields.text}}"
            fields:
              - { label: "Text", name: "text", widget: "string" }
              - { label: "Active", name: "active", widget: "boolean", default: true }
              - { label: "Order", name: "order", widget: "number", default: 100 }


  